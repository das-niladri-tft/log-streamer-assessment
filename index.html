<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Log Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Courier New", monospace;
        background-color: #1e1e1e;
        color: #d4d4d4;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      header {
        background-color: #2d2d30;
        padding: 20px;
        border-radius: 8px 8px 0 0;
        border-bottom: 2px solid #007acc;
      }

      h1 {
        color: #007acc;
        font-size: 24px;
        margin-bottom: 10px;
      }

      .status {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
        margin-top: 10px;
      }

      .status.connected {
        background-color: #4caf50;
        color: white;
      }

      .status.disconnected {
        background-color: #f44336;
        color: white;
      }

      .status.connecting {
        background-color: #ff9800;
        color: white;
      }

      .controls {
        background-color: #252526;
        padding: 15px 20px;
        display: flex;
        gap: 15px;
        align-items: center;
        border-bottom: 1px solid #3e3e42;
      }

      button {
        background-color: #007acc;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        font-family: inherit;
      }

      button:hover {
        background-color: #005a9e;
      }

      button:disabled {
        background-color: #3e3e42;
        cursor: not-allowed;
      }

      .stats {
        margin-left: auto;
        font-size: 12px;
        color: #858585;
      }

      #log-container {
        background-color: #1e1e1e;
        height: calc(100vh - 200px);
        overflow-y: auto;
        padding: 20px;
        border-radius: 0 0 8px 8px;
        font-size: 13px;
        line-height: 1.6;
      }

      .log-line {
        padding: 4px 0;
        border-bottom: 1px solid #2d2d30;
        word-wrap: break-word;
      }

      .log-line:hover {
        background-color: #2d2d30;
      }

      .log-line .timestamp {
        color: #6a9955;
        margin-right: 10px;
      }

      .log-line.new {
        animation: highlight 0.5s ease-in-out;
      }

      @keyframes highlight {
        0% {
          background-color: #007acc33;
        }
        100% {
          background-color: transparent;
        }
      }

      /* Scrollbar styling */
      #log-container::-webkit-scrollbar {
        width: 12px;
      }

      #log-container::-webkit-scrollbar-track {
        background: #1e1e1e;
      }

      #log-container::-webkit-scrollbar-thumb {
        background: #3e3e42;
        border-radius: 6px;
      }

      #log-container::-webkit-scrollbar-thumb:hover {
        background: #555;
      }

      .empty-state {
        text-align: center;
        color: #858585;
        padding: 40px;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Real-Time Log Viewer (tail -f)</h1>
        <span id="status" class="status connecting">Connecting...</span>
      </header>

      <div class="controls">
        <button id="clearBtn">Clear Logs</button>
        <button id="pauseBtn">Pause</button>
        <button id="reconnectBtn" disabled>Reconnect</button>
        <div class="stats">Lines: <span id="lineCount">0</span></div>
      </div>

      <div id="log-container">
        <div class="empty-state">Waiting for log data...</div>
      </div>
    </div>

    <script>
      let ws = null;
      let lineCount = 0;
      let isPaused = false;

      const statusEl = document.getElementById("status");
      const logContainer = document.getElementById("log-container");
      const lineCountEl = document.getElementById("lineCount");
      const clearBtn = document.getElementById("clearBtn");
      const pauseBtn = document.getElementById("pauseBtn");
      const reconnectBtn = document.getElementById("reconnectBtn");

      function updateStatus(status, text) {
        statusEl.className = `status ${status}`;
        statusEl.textContent = text;
      }

      function addLogLine(text) {
        if (isPaused) return;

        const logLine = document.createElement("div");
        logLine.className = "log-line new";

        const timestamp = document.createElement("span");
        timestamp.className = "timestamp";
        timestamp.textContent = new Date().toLocaleTimeString();

        const content = document.createElement("span");
        content.textContent = text;

        logLine.appendChild(timestamp);
        logLine.appendChild(content);

        logContainer.appendChild(logLine);
        lineCount++;
        lineCountEl.textContent = lineCount;
      }

      function clearLogs() {
        logContainer.innerHTML =
          '<div class="empty-state">Logs cleared. Waiting for new data...</div>';
        lineCount = 0;
        lineCountEl.textContent = lineCount;
      }

      function togglePause() {
        isPaused = !isPaused;
        pauseBtn.textContent = isPaused ? "Resume" : "Pause";
        pauseBtn.style.backgroundColor = isPaused ? "#4caf50" : "#007acc";
      }

      function connect() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${protocol}//${window.location.host}/ws`;

        console.log("Connecting to:", wsUrl);
        updateStatus("connecting", "Connecting...");
        reconnectBtn.disabled = true;

        ws = new WebSocket(wsUrl);

        ws.onopen = function () {
          console.log("WebSocket connection established");
          updateStatus("connected", "Connected");
          reconnectBtn.disabled = true;
        };

        ws.onmessage = function (event) {
          addLogLine(event.data);
        };

        ws.onclose = function (event) {
          console.log("WebSocket connection closed", event);
          updateStatus("disconnected", "Disconnected");
          reconnectBtn.disabled = false;
        };

        ws.onerror = function (error) {
          console.error("WebSocket error:", error);
          updateStatus("disconnected", "Connection Error");
        };
      }

      function reconnect() {
        if (ws) {
          ws.close();
        }
        connect();
      }

      clearBtn.addEventListener("click", clearLogs);
      pauseBtn.addEventListener("click", togglePause);
      reconnectBtn.addEventListener("click", reconnect);
    </script>
  </body>
</html>
